name: Deploy Im-Oei

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.js
        run: |
          cat > im-oei-v10/public/config.js << 'EOF'
          const firebaseConfig = {"apiKey":"AIzaSyBJjzTASSDoezaH2lPTUP1Fn9jS6RR-OUo","authDomain":"im-oei.firebaseapp.com","projectId":"im-oei","storageBucket":"im-oei.firebasestorage.app","messagingSenderId":"392812205535","appId":"1:392812205535:web:65f6ce114feb3ce035a06a","measurementId":"G-0LGSELSP0D"};
          firebase.initializeApp(firebaseConfig);
          EOF

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: im-oei
          entryPoint: im-oei-v10
