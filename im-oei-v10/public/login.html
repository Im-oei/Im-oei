<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>เข้าสู่ระบบ - อิ่มเอ๋ย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Prompt:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="hero-top">
  <img src="hero.webp" alt="อิ่มเอ๋ย" onerror="this.style.display='none'">
  <div class="hero-top-overlay"></div>
</div>

<div class="card-wrap">
  <div class="login-card">

    <!-- Error box -->
    <div class="error-box" id="error-box">
      <span id="error-msg">เกิดข้อผิดพลาด</span>
    </div>

    <div class="section-label">เข้าสู่ระบบ</div>

    <!-- LINE primary -->
    <button class="line-btn" onclick="lineLogin()">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="12" fill="white" fill-opacity="0.2"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M20 8C13.373 8 8 12.477 8 18c0 3.674 2.387 6.896 5.996 8.787-.247.899-.895 3.25-.976 3.636-.1.449.165.443.347.322.143-.096 2.276-1.546 3.196-2.17.787.112 1.607.17 2.437.17C26.627 28.745 32 24.27 32 18c0-5.523-5.373-10-12-10zm-5.5 13.25h-2.75a.5.5 0 0 1-.5-.5v-5.5a.5.5 0 0 1 1 0V20.25H14.5a.5.5 0 0 1 0 1zm2 0a.5.5 0 0 1-1 0v-5.5a.5.5 0 0 1 1 0v5.5zm5.25 0a.5.5 0 0 1-.867.34l-2.633-3.59v3.25a.5.5 0 0 1-1 0v-5.5a.5.5 0 0 1 .867-.34l2.633 3.59V15.75a.5.5 0 0 1 1 0v5.5zm3.75 0h-2.75a.5.5 0 0 1-.5-.5v-5.5a.5.5 0 0 1 .5-.5H25.5a.5.5 0 0 1 0 1H23.5V17.5H25.5a.5.5 0 0 1 0 1H23.5V20.25H25.5a.5.5 0 0 1 0 1z" fill="white"/>
      </svg>
      <div class="line-btn-text">
        <span class="line-btn-main">เข้าสู่ระบบด้วย LINE</span>
        <span class="line-btn-sub">กดครั้งเดียว ไม่ต้องกรอกอะไรเพิ่ม</span>
      </div>
    </button>

    <div class="line-benefits">
      <span class="benefit-chip">✅ ได้ชื่อ+รูปโปรไฟล์อัตโนมัติ</span>
      <span class="benefit-chip">🔔 แจ้งเตือนออเดอร์ผ่าน LINE</span>
      <span class="benefit-chip">⭐ สะสมแต้มได้จริง</span>
    </div>

    <div class="or-divider"><span>หรือ ถ้าไม่อยากผูก LINE</span></div>

    <!-- Guest fallback -->
    <button class="fallback-toggle" onclick="toggleGuest()">
      <div class="fallback-toggle-left">
        <div class="fallback-toggle-icon">📝</div>
        <div>
          <span class="fallback-toggle-text-main">เข้าแบบไม่ต้อง LINE</span>
          <span class="fallback-toggle-text-sub">สำหรับสั่งแบบไม่ต้อง login LINE</span>
        </div>
      </div>
      <svg class="chevron" id="guest-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="collapse-form" id="guest-form">
      <div class="collapse-inner">
        <div class="form-group">
          <label class="form-label">👤 ชื่อของคุณ</label>
          <input type="text" class="form-input" id="cust-name-1" placeholder="เช่น สมชาย, นิสา" maxlength="30"
            onkeydown="if(event.key==='Enter')customerLogin()">
        </div>
        <p style="font-size:11.5px;color:#AAA;margin:2px 0 12px;text-align:center;">ไม่ต้องใส่เบอร์ — แต่จะไม่ได้แต้มสะสม</p>
        <button class="guest-btn" id="guest-btn" onclick="customerLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          เริ่มสั่งอาหาร
        </button>
      </div>
    </div>

    <!-- Admin — ซ่อนล่างสุด -->
    <div class="admin-link-wrap">
      <button class="admin-link" onclick="toggleAdmin()">🔑 เข้าระบบแอดมิน</button>
    </div>

    <div class="collapse-form" id="admin-form">
      <div class="collapse-inner">
        <div class="form-group">
          <label class="form-label">📧 อีเมลผู้ดูแล</label>
          <input type="email" class="admin-input" id="admin-email" placeholder="admin@example.com"
            onkeydown="if(event.key==='Enter')document.getElementById('admin-password').focus()">
        </div>
        <div class="form-group" style="position:relative;">
          <label class="form-label">🔒 รหัสผ่าน</label>
          <input type="password" class="admin-input" id="admin-password" placeholder="••••••••"
            onkeydown="if(event.key==='Enter')adminLogin()">
          <button class="pwd-toggle" id="admin-eye" onclick="toggleAdminPwd()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BBB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button class="admin-btn" id="admin-btn" onclick="adminLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          เข้าสู่ระบบแอดมิน
        </button>
      </div>
    </div>

  </div>

  <button class="back-btn" onclick="window.location.href='index.html'">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    กลับหน้าหลัก
  </button>
</div>

<div class="loading-overlay" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<!-- OTP Modal -->
<div class="otp-overlay" id="otp-overlay">
  <div class="otp-sheet">
    <div class="otp-title">📱 ยืนยันเบอร์โทรศัพท์</div>
    <div class="otp-sub" id="otp-sub">เพื่อดูออเดอร์และสะสมแต้มของคุณ</div>

    <!-- Step 1: กรอกเบอร์ -->
    <div id="otp-step1">
      <div class="otp-field-wrap">
        <span class="otp-prefix">+66</span>
        <input class="otp-input" id="otp-phone" type="tel" maxlength="10"
          placeholder="0812345678" inputmode="numeric">
      </div>
      <div id="recaptcha-container"></div>
      <button class="otp-btn" id="otp-send-btn" onclick="otpSendCode()">
        ส่ง OTP
      </button>
      <button class="otp-skip" onclick="otpSkip()">ข้ามไปก่อน</button>
    </div>

    <!-- Step 2: กรอก OTP -->
    <div id="otp-step2" style="display:none">
      <div class="otp-sent-hint" id="otp-sent-hint"></div>
      <input class="otp-code-input" id="otp-code" type="tel" maxlength="6"
        placeholder="_ _ _ _ _ _" inputmode="numeric">
      <button class="otp-btn" id="otp-verify-btn" onclick="otpVerify()">
        ยืนยัน OTP
      </button>
      <button class="otp-skip" onclick="otpResend()">ส่งรหัสใหม่</button>
    </div>

    <div class="otp-error" id="otp-error"></div>
  </div>
</div>

<script>
// Global stubs — ทำงานก่อน module โหลดเสร็จ ป้องกัน "not defined"
function lineLogin(){ window._mod_lineLogin && window._mod_lineLogin(); }
function toggleGuest(){ var f=document.getElementById('guest-form'),c=document.getElementById('guest-chevron'); if(!f)return; var o=f.classList.toggle('open'); c&&c.classList.toggle('open',o); }
function toggleAdmin(){ var f=document.getElementById('admin-form'); if(f) f.classList.toggle('open'); }
function toggleAdminPwd(){ window._mod_toggleAdminPwd && window._mod_toggleAdminPwd(); }
function adminLogin(){ window._mod_adminLogin && window._mod_adminLogin(); }
function customerLogin(){ window._mod_customerLogin && window._mod_customerLogin(); }
function otpSendCode(){ window._mod_otpSendCode && window._mod_otpSendCode(); }
function otpVerify(){ window._mod_otpVerify && window._mod_otpVerify(); }
function otpSkip(){ window._mod_otpSkip && window._mod_otpSkip(); }
function otpResend(){ window._mod_otpResend && window._mod_otpResend(); }
</script>
<script type="module" src="js/login.module.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</body>
</html>
