<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#FF9F1C">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>อิ่มเอ้ย - IM OEI Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #f97316;
    --primary-light: #fff7ed;
    --primary-dark: #ea580c;
    --sidebar-bg: #1a1a2e;
    --sidebar-active: #f97316;
    --text-main: #1f2937;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --card-bg: #ffffff;
    --bg: #f8f9fb;
    --green: #10b981;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --yellow: #f59e0b;
    --red: #ef4444;
  }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 220px; min-width: 220px; background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh; overflow-y: auto;
  }
  .sidebar-logo {
    display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .logo-img {
    width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#f97316,#fb923c);
    display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden;
  }
  .logo-text { line-height: 1.2; }
  .logo-text .name { font-weight: 700; font-size: 14px; color: var(--text-main); }
  .logo-text .badge {
    display: inline-block; background: var(--primary); color: #fff;
    font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
  }
  .sidebar-nav { flex: 1; padding: 10px 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    color: var(--text-sub); font-size: 14px; font-weight: 500; cursor: pointer;
    border-radius: 8px; margin: 2px 8px; transition: all 0.15s; text-decoration: none;
    position: relative;
  }
  .nav-item:hover { background: var(--primary-light); color: var(--primary); }
  .nav-item.active { background: var(--primary); color: #fff; }
  .nav-item .icon { width: 18px; text-align: center; font-size: 16px; }
  .nav-item .badge-count {
    margin-left: auto; background: var(--red); color: #fff;
    font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 700;
  }
  .nav-item.active .badge-count { background: rgba(255,255,255,0.3); }
  .logout-btn:hover { color: var(--red); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* TOPBAR */
  .topbar {
    background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 24px; height: 60px;
    flex-shrink: 0;
  }
  .search-box {
    flex: 1; max-width: 380px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  }
  .search-box input { border: none; background: none; outline: none; font-family: 'Sarabun', sans-serif; font-size: 14px; width: 100%; color: var(--text-main); }
  .search-box input::placeholder { color: var(--text-sub); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .notif-btn {
    position: relative; width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
  }
  .notif-btn .dot {
    position: absolute; top: 3px; right: 3px; width: 16px; height: 16px;
    background: var(--red); border-radius: 50%; font-size: 10px; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .user-chip {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border);
  }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #fed7aa; overflow: hidden; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info .uname { font-size: 13px; font-weight: 600; }
  .user-info .ustatus { font-size: 11px; color: var(--green); }
  .ustatus::before { content: '● '; }

  /* CONTENT */
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .page-header { margin-bottom: 20px; }
  .page-header h1 { font-size: 22px; font-weight: 700; }
  .page-header p { color: var(--text-sub); font-size: 13px; }
  .page-header-row { display: flex; align-items: flex-start; justify-content: space-between; }
  .date-badge {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-sub); font-size: 13px;
  }

  /* STAT CARDS */
  .stat-cards { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    flex: 1; min-width: 140px; background: var(--card-bg);
    border-radius: 12px; padding: 16px; border: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .stat-card:active { transform: scale(0.98); }
  .stat-card.primary { background: linear-gradient(135deg, #f97316, #fb923c); border-color: transparent; }
  .stat-card.primary * { color: #fff !important; }
  .stat-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .stat-card.primary .stat-icon { background: rgba(255,255,255,0.2); }
  .stat-icon.green { background: #d1fae5; }
  .stat-icon.blue { background: #dbeafe; }
  .stat-icon.purple { background: #ede9fe; }
  .stat-icon.yellow { background: #fef3c7; }
  .stat-body .label { font-size: 12px; color: var(--text-sub); margin-bottom: 2px; }
  .stat-body .value { font-size: 22px; font-weight: 800; color: var(--text-main); line-height: 1; }
  .stat-body .change { font-size: 12px; color: var(--green); margin-top: 2px; }
  .stat-card.primary .stat-body .label { color: rgba(255,255,255,0.8); }
  .stat-card.primary .stat-body .change { color: rgba(255,255,255,0.85); }

  /* GRID LAYOUT */
  .grid-row { display: grid; gap: 16px; margin-bottom: 16px; }
  .grid-row.two { grid-template-columns: 1.8fr 1fr 1fr; }
  .grid-row.three-equal { grid-template-columns: 1fr 1fr 1fr; }
  .grid-chart-row { grid-template-columns: 1.8fr 1fr 1fr; }
  .grid-bottom-row { grid-template-columns: 1fr 1fr 1fr 1fr; }

  /* ===== HAMBURGER (hidden on desktop) ===== */
  .hamburger { display: none; background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; color: var(--text-main); }

  /* ===== TABLET: 768–1024px ===== */
  @media (max-width: 1024px) {
    .sidebar { width: 180px; min-width: 180px; }
    .grid-chart-row { grid-template-columns: 1fr 1fr; }
    .grid-chart-row > .chart-card { grid-column: 1 / -1; }
    .grid-bottom-row { grid-template-columns: 1fr 1fr; }
    .stat-cards { gap: 10px; }
    .stat-card { min-width: 120px; }
  }

  /* ===== MOBILE: ≤767px ===== */
  @media (max-width: 767px) {
    body { overflow: auto; flex-direction: column; height: auto; }

    /* Sidebar becomes top drawer */
    .sidebar {
      position: fixed; top: 0; left: -260px; width: 260px; min-width: 260px;
      height: 100%; z-index: 1000; transition: left .28s ease; box-shadow: 4px 0 24px rgba(0,0,0,.15);
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 999;
    }
    .sidebar-overlay.open { display: block; }

    /* Main takes full width */
    .main { width: 100%; height: auto; min-height: 100vh; overflow: visible; }

    /* Topbar */
    .topbar { padding: 0 14px; gap: 8px; }
    .hamburger { display: flex; align-items: center; }
    .search-box { max-width: 100%; flex: 1; }

    /* Content */
    .content { padding: 14px; overflow: visible; }

    /* Stat cards — 2 columns on mobile */
    .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { min-width: 0; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .stat-card:active { transform: scale(0.98); }
  .stat-card.primary { grid-column: 1 / -1; }

    /* All grids → single column */
    .grid-row,
    .grid-row.two,
    .grid-row.three-equal,
    .grid-chart-row,
    .grid-bottom-row { grid-template-columns: 1fr; }

    /* Remove chart column spanning override */
    .grid-chart-row > .chart-card { grid-column: unset; }

    /* Donut wraps nicely on small screen */
    .donut-wrap { flex-direction: column; align-items: flex-start; gap: 10px; }

    /* Page header */
    .page-header-row { flex-direction: column; gap: 10px; align-items: flex-start; }

    /* Footer */
    .footer { text-align: center; font-size: 11px; }
  }

  /* ===== SMALL PHONE: ≤400px ===== */
  @media (max-width: 400px) {
    .stat-cards { grid-template-columns: 1fr; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .stat-card:active { transform: scale(0.98); }
  .stat-card.primary { grid-column: unset; }
    .content { padding: 10px; }
  }

  .card {
    background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 16px;
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-title { font-size: 14px; font-weight: 700; }
  .card-link { font-size: 12px; color: var(--primary); cursor: pointer; font-weight: 600; }

  /* CHART */
  .chart-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 16px; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .chart-title { font-size: 14px; font-weight: 700; }
  .chart-period-btn {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
    font-size: 12px; background: #fff; cursor: pointer; display: flex; align-items: center; gap: 4px;
    font-family: 'Sarabun', sans-serif;
  }

  /* ORDER LIST */
  .order-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .order-item:last-child { border-bottom: none; }
  .order-id { font-size: 13px; font-weight: 700; flex: 1; }
  .order-id .sub { font-size: 11px; color: var(--text-sub); font-weight: 400; margin-top: 1px; }
  .order-price { font-size: 13px; font-weight: 700; text-align: right; }
  .order-price .sub { font-size: 11px; color: var(--text-sub); font-weight: 400; }
  .status-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap;
  }
  .status-badge.inprogress { background: #dbeafe; color: #1d4ed8; }
  .status-badge.done { background: #d1fae5; color: #065f46; }
  .status-badge.cancel { background: #fee2e2; color: #991b1b; }
  .status-badge.ready { background: #f3f4f6; color: #374151; }
  .channel-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 14px; }

  /* NOTIFICATION */
  .notif-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .notif-dot.red { background: #fee2e2; }
  .notif-dot.yellow { background: #fef3c7; }
  .notif-dot.blue { background: #dbeafe; }
  .notif-dot.green { background: #d1fae5; }
  .notif-body { flex: 1; }
  .notif-body .ntitle { font-size: 13px; font-weight: 600; }
  .notif-body .nsub { font-size: 11px; color: var(--text-sub); }
  .notif-time { font-size: 11px; color: var(--text-sub); white-space: nowrap; }

  /* CHANNELS PIE */
  .channel-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .channel-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .channel-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .channel-name { flex: 1; color: var(--text-sub); }
  .channel-pct { font-weight: 700; }

  /* MENU TOP */
  .menu-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .menu-rank.r1 { background: #f59e0b; }
  .menu-rank.r2 { background: #9ca3af; }
  .menu-rank.r3 { background: #cd7f32; }
  .menu-img { width: 36px; height: 36px; border-radius: 8px; background: #f3f4f6; overflow: hidden; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .menu-info { flex: 1; }
  .menu-info .mname { font-size: 13px; font-weight: 600; }
  .menu-info .msub { font-size: 11px; color: var(--text-sub); }
  .menu-price { font-size: 13px; font-weight: 700; color: var(--primary); }

  /* NEW CUSTOMERS */
  .new-customer-card { text-align: center; }
  .customer-count { font-size: 36px; font-weight: 800; color: var(--green); }
  .customer-change { font-size: 12px; color: var(--green); margin-bottom: 8px; }
  .avatar-group { display: flex; justify-content: center; }
  .avatar-group .av { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px; background: linear-gradient(135deg,#f97316,#fbbf24); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .avatar-group .av:first-child { margin-left: 0; }
  .av-more { background: #e5e7eb; color: var(--text-sub); font-size: 10px; font-weight: 700; }

  /* REVIEW */
  .review-item { padding: 8px 0; }
  .review-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .review-av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#3b82f6,#60a5fa); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .review-name { font-size: 13px; font-weight: 600; }
  .review-stars { color: #f59e0b; font-size: 13px; }
  .review-date { font-size: 11px; color: var(--text-sub); margin-left: auto; }
  .review-text { font-size: 12px; color: var(--text-sub); }

  /* FOOTER */
  .footer { text-align: center; padding: 8px; font-size: 12px; color: var(--text-sub); }

  /* DONUT */
  .donut-wrap { display: flex; align-items: center; gap: 16px; }
  .donut-center { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
  .donut-total { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  .donut-total .total-num { font-size: 18px; font-weight: 800; }
  .donut-total .total-label { font-size: 10px; color: var(--text-sub); }

  /* ===== PANELS ===== */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ===== PANEL INNER SECTIONS ===== */
  .section-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 14px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
  .form-group label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
  .form-group input, .form-group select, .form-group textarea { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: 'Sarabun', sans-serif; font-size: 13px; background: var(--bg); color: var(--text-main); width: 100%; box-sizing: border-box; }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .btn-primary { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; box-shadow: 0 2px 8px rgba(249,115,22,0.3); } .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(249,115,22,0.4); } .btn-primary:active { transform: scale(0.97); }
  .btn-secondary { background: #fff; color: var(--text-main); border: 1px solid var(--border); border-radius: 10px; padding: 9px 18px; font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform 0.12s, background 0.12s; } .btn-secondary:hover { background: #f9fafb; transform: translateY(-1px); } .btn-secondary:active { transform: scale(0.97); }
  .btn-danger { background: #E53935; color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* ===== KPI CARDS (Stats panel) ===== */
  .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
  .kpi-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); padding: 16px; }
  .kpi-value { font-size: 22px; font-weight: 800; }
  .kpi-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .kpi-vs { font-size: 11px; margin-top: 4px; }
  @media (max-width: 767px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }

  /* ===== PERIOD TABS ===== */
  .period-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .period-btn { background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-family: 'Sarabun', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-sub); }
  .period-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ===== FILTER CHIPS ===== */
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-chip { background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-family: 'Sarabun', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-sub); }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ===== CUSTOMER CARD ===== */
  .customer-card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .customer-info { flex: 1; min-width: 0; }
  .customer-name { font-size: 14px; font-weight: 700; }
  .customer-meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .customer-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ===== MENU ADMIN ITEMS ===== */
  .menu-item-admin { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); padding: 10px 12px; margin-bottom: 8px; }
  .menu-item-admin .food-emoji { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: #fef3c7; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .menu-item-admin .food-emoji img { width: 100%; height: 100%; object-fit: cover; }
  .menu-item-admin .info { flex: 1; min-width: 0; }
  .menu-item-admin .info .name { font-size: 13px; font-weight: 700; }
  .menu-item-admin .info .price { font-size: 12px; color: var(--primary); font-weight: 700; }
  .menu-item-admin .actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; flex-wrap: wrap; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, box-shadow 0.12s; } .icon-btn:hover { transform: scale(1.1); box-shadow: 0 2px 8px rgba(0,0,0,0.1); } .icon-btn:active { transform: scale(0.95); }
  .btn-edit { background: #e0f2fe; }
  .btn-img { background: #f3e8ff; }
  .btn-hide { background: #fef9c3; }
  .hidden-badge { background: #fee2e2; color: #b91c1c; border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 700; }
  .soldout-toggle-wrap { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .soldout-switch { position: relative; display: inline-block; width: 32px; height: 18px; }
  .soldout-switch input { opacity: 0; width: 0; height: 0; }
  .soldout-switch .sl { position: absolute; inset: 0; background: #ccc; border-radius: 9px; cursor: pointer; transition: .3s; }
  .soldout-switch input:checked + .sl { background: #ef4444; }
  .soldout-switch .sl:before { content: ''; position: absolute; width: 12px; height: 12px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }

<script>
(function(){
  function hideLoader(){
    var el=document.getElementById('app-loader');
    if(el){el.classList.add('hide');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},520);}

})();
