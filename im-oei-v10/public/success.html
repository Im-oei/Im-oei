<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สั่งซื้อสำเร็จ — อิ่มเอ๋ย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(160deg,#FFF9F0 0%,#FFF3DC 60%,#FFE8B0 100%);font-family:'Sarabun',sans-serif;display:flex;flex-direction:column;align-items:center;padding:0 0 40px}

/* HERO */
.hero{width:100%;background:linear-gradient(135deg,#FF8C00,#FFC107);padding:36px 20px 60px;text-align:center;position:relative;overflow:hidden;min-height:180px;}
.hero::after{content:'';position:absolute;bottom:-24px;left:0;right:0;height:48px;background:linear-gradient(160deg,#FFF9F0 0%,#FFF3DC 100%);border-radius:50% 50% 0 0 / 100% 100% 0 0}
.confetti{font-size:36px;margin-bottom:10px;animation:bounce 0.6s ease-out}
.hero-title{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.2)}
.hero-sub{font-size:14px;color:rgba(255,255,255,0.9);font-weight:600;margin-top:6px}
@keyframes bounce{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* CARD */
.card{background:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 8px 32px rgba(255,140,0,0.12);width:calc(100% - 32px);max-width:420px;margin-top:-24px;position:relative;z-index:1}
.card+.card{margin-top:14px}

/* ORDER INFO */
.order-id{font-family:'Prompt',sans-serif;font-size:22px;font-weight:800;color:#E65100;text-align:center;margin-bottom:16px;letter-spacing:1px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #FFF3E0}
.info-row:last-child{border-bottom:none}
.info-key{font-size:13px;color:#999;font-weight:600}
.info-val{font-size:13px;font-weight:800;color:#2C2C2C;text-align:right;max-width:60%}
.info-val.orange{color:#E65100}
.location-val{color:#1565C0!important}

/* ITEMS */
.items-title{font-size:11px;font-weight:800;color:#999;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #F5EDE0}
.item-row:last-child{border-bottom:none}
.item-qty{background:#FFF3E0;color:#FF8C00;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;flex-shrink:0}
.item-name{font-size:13px;font-weight:700;color:#2C2C2C;flex:1;margin:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-price{font-size:13px;font-weight:800;color:#E65100;flex-shrink:0}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:2px solid #F5EDE0}
.total-label{font-size:14px;font-weight:700;color:#888}
.total-val{font-size:22px;font-weight:800;color:#E65100;font-family:'Prompt',sans-serif}

/* STAMP */
.stamp-box{background:linear-gradient(135deg,#FF6B35,#FF8C00);border-radius:18px;padding:16px;text-align:center;color:#fff}
.stamp-icon{font-size:32px;margin-bottom:6px}
.stamp-text{font-size:15px;font-weight:800}
.stamp-sub{font-size:12px;opacity:0.85;margin-top:4px}

/* PREORDER */
.preorder-box{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:18px;padding:14px;text-align:center;color:#fff;font-size:13px;font-weight:700}

/* BUTTONS */
.btn-wrap{display:flex;flex-direction:column;gap:10px;width:calc(100%-32px);max-width:420px;padding:0 16px}
.btn-main{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:16px;font-family:'Prompt',sans-serif;font-size:15px;font-weight:800;text-decoration:none;transition:transform 0.15s}
.btn-main:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,#FFC107,#FF8C00);color:#3E2000;box-shadow:0 4px 16px rgba(255,140,0,0.35)}
.btn-secondary{background:#fff;color:#666;border:2px solid #E8E8E8}
.btn-ghost{background:none;border:none;font-size:12px;color:#bbb;padding:8px;cursor:pointer;text-decoration:underline;font-family:'Sarabun',sans-serif}
.note{font-size:12px;color:#bbb;text-align:center;padding:4px 0}

  /* ===== FULL-SCREEN LOADING OVERLAY ===== */
  #app-loader {
    position: fixed; inset: 0; z-index: 99999;
    background: #FFF9F0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #app-loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #app-loader .al-logo {
    width: 88px; height: 88px; min-width: 88px; min-height: 88px; max-width: 88px; max-height: 88px;
    border-radius: 24px; object-fit: cover;
    animation: alPulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes alPulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,140,0,0.35); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(255,140,0,0); }
  }
  </style>
</head>
<body>
<div id="app-loader">
  <img class="al-logo" src="logo.webp" alt="อิ่มเอ๋ย">
</div>

<div class="hero">
  <img src="hero.webp" alt="อิ่มเอ๋ย" style="width:100%;height:180px;object-fit:cover;display:block;position:absolute;inset:0;opacity:0.35;">
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;">
    <img src="logo.webp" alt="อิ่มเอ๋ย" style="width:72px;height:72px;border-radius:20px;object-fit:cover;box-shadow:0 4px 20px rgba(0,0,0,0.2);margin-bottom:10px;">
    <div class="confetti">🎉</div>
  </div>
</div>

<!-- ORDER ID -->
<div class="card" style="margin-top:-24px">
  <div class="order-id" id="s-id">#??????</div>

  <div class="info-row">
    <span class="info-key">ชื่อผู้สั่ง</span>
    <span class="info-val" id="s-name">-</span>
  </div>
  <div class="info-row">
    <span class="info-key">⏰ เวลารับอาหาร</span>
    <span class="info-val" id="s-time">07:30 น.</span>
  </div>
  <div class="info-row" id="s-location-row" style="display:none">
    <span class="info-key">📍 จุดรับอาหาร</span>
    <span class="info-val location-val" id="s-location">-</span>
  </div>
  <div class="info-row" id="s-date-row">
    <span class="info-key">📅 วันที่สั่ง</span>
    <span class="info-val" id="s-date">-</span>
  </div>
</div>

<!-- ITEMS -->
<div class="card" id="s-items-card" style="display:none">
  <div class="items-title">รายการที่สั่ง</div>
  <div id="s-items-list"></div>
  <div class="total-row">
    <span class="total-label">ยอดรวมทั้งหมด</span>
    <span class="total-val" id="s-total">0 บาท</span>
  </div>
</div>

<!-- STAMP -->
<div class="card" id="stamp-card" style="display:none">
  <div class="stamp-box">
    <div class="stamp-icon">⭐</div>
    <div class="stamp-text" id="stamp-text"></div>
    <div class="stamp-sub" id="stamp-sub"></div>
  </div>
</div>

<!-- PREORDER -->
<div class="card" id="preorder-card" style="display:none">
  <div class="preorder-box" id="preorder-text"></div>
</div>

<!-- BUTTONS -->
<div style="height:20px"></div>
<div class="btn-wrap">
  <a class="btn-main btn-primary" id="btn-status" href="orders.html">📋 ดูสถานะออเดอร์</a>
  <a class="btn-main btn-secondary" href="index.html">🛒 สั่งเพิ่มอีก</a>
</div>
<div style="margin-top:12px;text-align:center">
  <a href="index.html" class="btn-ghost">← กลับหน้าหลัก</a>
</div>

<script src="js/success.js"></script>

<script>
  // Hide loader when page is ready
  (function(){
    function hideLoader(){
      var el = document.getElementById('app-loader');
      if(el){ el.classList.add('hide'); setTimeout(function(){ el.remove(); }, 450); }
    }
    if(document.readyState === 'complete') { setTimeout(hideLoader, 400); }
    else { window.addEventListener('load', function(){ setTimeout(hideLoader, 400); }); }
  })();
</script>
<script>
(function(){
  function hideLoader(){
    var el=document.getElementById('app-loader');
    if(el){el.classList.add('hide');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},520);}
  }
  if(document.readyState==='complete'){setTimeout(hideLoader,350);}
  else{window.addEventListener('load',function(){setTimeout(hideLoader,350);});}
})();
</script>
</body>
</html>
