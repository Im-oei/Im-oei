<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>🍳 Kitchen Display — อิ่มเอ๋ย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800;900&family=Prompt:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f172a;
    --bg2:       #1e293b;
    --bg3:       #334155;
    --border:    rgba(255,255,255,0.07);
    --text:      #f1f5f9;
    --text-sub:  #94a3b8;
    --orange:    #f97316;
    --orange-d:  #ea580c;
    --blue:      #3b82f6;
    --green:     #22c55e;
    --green-d:   #16a34a;
    --yellow:    #eab308;
    --red:       #ef4444;
    --purple:    #a855f7;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .topbar-logo { font-family:'Prompt',sans-serif; font-size:20px; font-weight:900; color:var(--orange); letter-spacing:0.5px; }
  .topbar-badge { background:var(--bg3); color:var(--text-sub); font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:1px; }
  .topbar-time { font-size:28px; font-weight:900; font-family:'Prompt',sans-serif; color:var(--text); letter-spacing:2px; }
  .topbar-date { font-size:12px; color:var(--text-sub); text-align:right; line-height:1.4; }

  /* ── COLUMN HEADERS ── */
  .cols-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    flex-shrink: 0;
  }
  .col-header {
    padding: 10px 16px 8px;
    text-align: center;
    border-bottom: 3px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .col-header.pending  { border-color: var(--orange); background: rgba(249,115,22,0.06); }
  .col-header.cooking  { border-color: var(--blue);   background: rgba(59,130,246,0.06); }
  .col-header.ready    { border-color: var(--green);  background: rgba(34,197,94,0.06);  }
  .col-header-icon { font-size:20px; }
  .col-header-label { font-size:14px; font-weight:800; font-family:'Prompt',sans-serif; letter-spacing:0.5px; }
  .col-header.pending  .col-header-label { color: var(--orange); }
  .col-header.cooking  .col-header-label { color: var(--blue);   }
  .col-header.ready    .col-header-label { color: var(--green);  }
  .col-count {
    font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; min-width:22px; text-align:center;
  }
  .col-header.pending  .col-count { background:rgba(249,115,22,0.2);  color:var(--orange); }
  .col-header.cooking  .col-count { background:rgba(59,130,246,0.2);  color:var(--blue);   }
  .col-header.ready    .col-count { background:rgba(34,197,94,0.2);   color:var(--green);  }

  /* ── MAIN GRID ── */
  .main {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 54px); /* topbar */
  }
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    flex: 1;
    overflow: hidden;
  }
  .col {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 10px 8px 12px;
    gap: 8px;
    border-right: 1px solid var(--border);
    scrollbar-width: thin;
    scrollbar-color: var(--bg3) transparent;
  }
  .col:last-child { border-right: none; }
  .col::-webkit-scrollbar { width:4px; }
  .col::-webkit-scrollbar-track { background:transparent; }
  .col::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:2px; }

  /* ── ORDER CARD ── */
  .order-card {
    background: var(--bg2);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    animation: slideIn 0.3s ease;
    transition: box-shadow 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(-10px) scale(0.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .order-card.urgent { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 20px rgba(239,68,68,0.2); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 1px var(--red),0 0 12px rgba(239,68,68,0.15)} 50%{box-shadow:0 0 0 1px var(--red),0 0 28px rgba(239,68,68,0.35)} }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px 7px;
    border-bottom: 1px solid var(--border);
  }
  .card-header.pending  { background: rgba(249,115,22,0.10); }
  .card-header.cooking  { background: rgba(59,130,246,0.10); }
  .card-header.ready    { background: rgba(34,197,94,0.10);  }

  .order-num { font-size:16px; font-weight:900; font-family:'Prompt',sans-serif; }
  .card-header.pending  .order-num { color:var(--orange); }
  .card-header.cooking  .order-num { color:var(--blue);   }
  .card-header.ready    .order-num { color:var(--green);  }

  .order-meta { text-align:right; line-height:1.3; }
  .order-name { font-size:11px; font-weight:700; color:var(--text); }
  .order-time-ago {
    font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px;
  }
  .order-time-ago.ok     { color:var(--text-sub); background:transparent; }
  .order-time-ago.warn   { color:var(--yellow); background:rgba(234,179,8,0.12); }
  .order-time-ago.urgent { color:var(--red);    background:rgba(239,68,68,0.12); }

  .card-items { padding:8px 12px; }
  .item-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .item-row:last-child { border-bottom:none; }
  .item-qty {
    font-size:14px; font-weight:900; color:var(--orange);
    min-width:22px; text-align:center; font-family:'Prompt',sans-serif;
    flex-shrink:0;
  }
  .item-name { flex:1; font-weight:700; color:var(--text); line-height:1.35; }
  .item-note { font-size:11px; color:var(--yellow); font-weight:600; margin-top:1px; }

  .card-note {
    padding:5px 12px 7px;
    font-size:11px; color:var(--yellow); font-weight:600;
    background:rgba(234,179,8,0.05);
    border-top:1px dashed rgba(234,179,8,0.2);
    display:flex; gap:5px; align-items:flex-start;
  }

  /* ── ACTION BUTTONS ── */
  .card-actions { padding:8px 10px; display:flex; gap:6px; }
  .btn-action {
    flex:1; padding:8px 4px; border:none; border-radius:8px;
    font-family:'Sarabun',sans-serif; font-size:12px; font-weight:800;
    cursor:pointer; transition:all .15s; letter-spacing:0.2px;
  }
  .btn-cook   { background:rgba(59,130,246,0.15); color:var(--blue);  border:1px solid rgba(59,130,246,0.3); }
  .btn-cook:hover { background:var(--blue); color:#fff; }
  .btn-ready  { background:rgba(34,197,94,0.15);  color:var(--green); border:1px solid rgba(34,197,94,0.3);  }
  .btn-ready:hover  { background:var(--green);  color:#fff; }
  .btn-done   { background:rgba(168,85,247,0.15); color:var(--purple);border:1px solid rgba(168,85,247,0.3); }
  .btn-done:hover   { background:var(--purple); color:#fff; }
  .btn-cancel { background:rgba(239,68,68,0.10);  color:var(--red);   border:1px solid rgba(239,68,68,0.2);  font-size:11px; flex:0.5; }
  .btn-cancel:hover { background:var(--red); color:#fff; }

  /* ── EMPTY STATE ── */
  .empty-col {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; opacity:0.25; gap:8px; padding-bottom:40px;
    pointer-events:none;
  }
  .empty-col .e-icon { font-size:40px; }
  .empty-col .e-text { font-size:13px; font-weight:700; color:var(--text-sub); }

  /* ── DONE TICKER ── */
  .done-ticker {
    grid-column: 1/-1;
    background: rgba(34,197,94,0.08);
    border-top: 1px solid rgba(34,197,94,0.15);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .done-ticker-label { font-size:11px; font-weight:800; color:var(--green); flex-shrink:0; }
  .done-ticker-items { display:flex; gap:14px; overflow:hidden; flex-wrap:nowrap; }
  .done-chip {
    font-size:11px; font-weight:700; color:rgba(34,197,94,0.7);
    background:rgba(34,197,94,0.08); padding:2px 9px; border-radius:20px;
    border:1px solid rgba(34,197,94,0.15); flex-shrink:0; white-space:nowrap;
  }

  /* ── SOUND INDICATOR ── */
  .sound-btn {
    background:var(--bg3); border:1px solid var(--border);
    color:var(--text-sub); font-size:13px; padding:4px 10px;
    border-radius:8px; cursor:pointer; transition:all .2s;
    display:flex; align-items:center; gap:5px; font-family:'Sarabun',sans-serif;
    font-weight:700;
  }
  .sound-btn.on { background:rgba(249,115,22,0.15); color:var(--orange); border-color:rgba(249,115,22,0.3); }

  /* ── LOGIN OVERLAY ── */
  #login-overlay {
    position:fixed; inset:0; background:var(--bg); z-index:1000;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px;
  }
  .login-box {
    background:var(--bg2); border:1px solid var(--border);
    border-radius:20px; padding:32px; width:320px; text-align:center;
  }
  .login-title { font-family:'Prompt',sans-serif; font-size:22px; font-weight:900; color:var(--orange); margin-bottom:6px; }
  .login-sub { font-size:13px; color:var(--text-sub); margin-bottom:20px; }
  .login-input {
    width:100%; padding:12px 16px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg3);
    color:var(--text); font-family:'Sarabun',sans-serif; font-size:15px;
    margin-bottom:12px; outline:none;
  }
  .login-input:focus { border-color:var(--orange); }
  .login-btn {
    width:100%; padding:13px; border-radius:10px; border:none;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    color:#fff; font-family:'Sarabun',sans-serif; font-size:15px; font-weight:800;
    cursor:pointer; transition:opacity .2s;
  }
  .login-btn:hover { opacity:0.9; }
  .login-err { font-size:12px; color:var(--red); margin-top:6px; min-height:16px; }
</style>
</head>
<body>

<!-- ── LOGIN OVERLAY ── -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-title">🍳 Kitchen Display</div>
    <div class="login-sub">อิ่มเอ๋ย — ระบบแสดงออเดอร์ครัว</div>
    <input id="pw-input" class="login-input" type="password" placeholder="รหัสผ่าน Admin" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div class="main" id="app" style="display:none">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🍱 อิ่มเอ๋ย</div>
      <div class="topbar-badge">KITCHEN</div>
      <div id="realtime-dot" style="width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-left:4px;transition:background .5s"></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔕 เสียง</button>
      <div>
        <div class="topbar-time" id="clock">--:--</div>
        <div class="topbar-date" id="date-display"></div>
      </div>
    </div>
  </div>

  <!-- COL HEADERS -->
  <div class="cols-wrap">
    <div class="col-header pending">
      <span class="col-header-icon">🟡</span>
      <span class="col-header-label">รอรับ</span>
      <span class="col-count" id="count-pending">0</span>
    </div>
    <div class="col-header cooking">
      <span class="col-header-icon">🔵</span>
      <span class="col-header-label">กำลังทำ</span>
      <span class="col-count" id="count-cooking">0</span>
    </div>
    <div class="col-header ready">
      <span class="col-header-icon">🟢</span>
      <span class="col-header-label">พร้อมรับ</span>
      <span class="col-count" id="count-ready">0</span>
    </div>
  </div>

  <!-- BOARD -->
  <div class="board">
    <div class="col" id="col-pending"></div>
    <div class="col" id="col-cooking"></div>
    <div class="col" id="col-ready"></div>
  </div>

  <!-- DONE TICKER -->
  <div class="done-ticker" id="done-ticker" style="display:none">
    <span class="done-ticker-label">✅ เสร็จแล้ว</span>
    <div class="done-ticker-items" id="done-items"></div>
  </div>

</div>

<script type="module">
import { initializeApp }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { FIREBASE_CONFIG } from "./config.js";

// ── Firebase init ──
const app  = initializeApp(FIREBASE_CONFIG);
const db   = getFirestore(app);
const auth = getAuth(app);

// ── State ──
let allOrders    = [];
let soundEnabled = false;
let knownIds     = new Set();
let unsub        = null;

// ── Clock ──
function updateClock() {
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2,'0');
  const mm  = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hh + ':' + mm;
  const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
  document.getElementById('date-display').textContent =
    days[now.getDay()] + ' ' + now.getDate() + '/' + (now.getMonth()+1) + '/' + (now.getFullYear()+543);
}
updateClock();
setInterval(updateClock, 5000);

// ── Time ago ──
function minsAgo(order) {
  const d = order.createdAt?.toDate ? order.createdAt.toDate() : (order.createdAt ? new Date(order.createdAt) : null);
  if (!d) return 0;
  return Math.floor((Date.now() - d.getTime()) / 60000);
}
function timeLabel(mins) {
  if (mins < 60) return mins + ' นาที';
  return Math.floor(mins/60) + 'ชม. ' + (mins%60) + 'น.';
}
function urgencyClass(mins, status) {
  if (status === 'pending'  && mins >= 10) return 'urgent';
  if (status === 'preparing'&& mins >= 20) return 'urgent';
  if (mins >= 7 && status==='pending')  return 'warn';
  if (mins >= 15&& status==='preparing')return 'warn';
  return 'ok';
}

// ── Sound ──
function playBeep() {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,150,300].forEach((delay, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880 - i*80;
      g.gain.setValueAtTime(0.3, ctx.currentTime + delay/1000);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay/1000 + 0.3);
      o.start(ctx.currentTime + delay/1000);
      o.stop(ctx.currentTime + delay/1000 + 0.3);
    });
  } catch(e) {}
}

window.toggleSound = function() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundEnabled ? '🔔 เสียง' : '🔕 เสียง';
  btn.className = 'sound-btn' + (soundEnabled ? ' on' : '');
};

// ── Status update ──
window.changeStatus = async function(orderId, newStatus) {
  try {
    await updateDoc(doc(db, 'orders', orderId), {
      status: newStatus,
      updatedAt: serverTimestamp(),
    });
  } catch(e) {
    alert('อัพเดทไม่ได้: ' + (e.code || e.message));
  }
};

// ── Render card ──
function orderCard(o) {
  const mins  = minsAgo(o);
  const urg   = urgencyClass(mins, o.status);
  const isUrgent = urg === 'urgent';

  const shortId = o.id ? '#' + o.id.slice(-4).toUpperCase() : '#????';
  const customerName = o.customerName || o.displayName || o.customerPhone || '—';

  const itemsHtml = (o.items||[]).map(item => `
    <div class="item-row">
      <span class="item-qty">${item.qty||1}x</span>
      <div>
        <div class="item-name">${item.name||'?'}</div>
        ${item.note ? `<div class="item-note">📝 ${item.note}</div>` : ''}
      </div>
    </div>
  `).join('');

  const noteHtml = o.note
    ? `<div class="card-note">📝 <span>${o.note}</span></div>` : '';

  // Buttons by status
  let actionsHtml = '';
  if (o.status === 'pending') {
    actionsHtml = `
      <div class="card-actions">
        <button class="btn-action btn-cook" onclick="changeStatus('${o.id}','preparing')">🔵 เริ่มทำ</button>
        <button class="btn-action btn-cancel" onclick="changeStatus('${o.id}','cancelled')">✕</button>
      </div>`;
  } else if (o.status === 'preparing') {
    actionsHtml = `
      <div class="card-actions">
        <button class="btn-action btn-ready" onclick="changeStatus('${o.id}','ready')">🟢 พร้อมแล้ว</button>
        <button class="btn-action btn-cancel" onclick="changeStatus('${o.id}','cancelled')">✕</button>
      </div>`;
  } else if (o.status === 'ready') {
    actionsHtml = `
      <div class="card-actions">
        <button class="btn-action btn-done" onclick="changeStatus('${o.id}','done')">✅ ส่งแล้ว</button>
      </div>`;
  }

  const card = document.createElement('div');
  card.className = 'order-card' + (isUrgent ? ' urgent' : '');
  card.id = 'kcard-' + o.id;
  card.innerHTML = `
    <div class="card-header ${o.status === 'preparing' ? 'cooking' : o.status}">
      <span class="order-num">${shortId}</span>
      <div class="order-meta">
        <div class="order-name">${customerName}</div>
        <span class="order-time-ago ${urg}">${timeLabel(mins)}</span>
      </div>
    </div>
    <div class="card-items">${itemsHtml}</div>
    ${noteHtml}
    ${actionsHtml}
  `;
  return card;
}

// ── Render board ──
function renderBoard() {
  const pending  = allOrders.filter(o => o.status === 'pending');
  const cooking  = allOrders.filter(o => o.status === 'preparing');
  const ready    = allOrders.filter(o => o.status === 'ready');
  const done     = allOrders.filter(o => o.status === 'done').slice(0,12);

  document.getElementById('count-pending').textContent  = pending.length;
  document.getElementById('count-cooking').textContent  = cooking.length;
  document.getElementById('count-ready').textContent    = ready.length;

  // helper to fill a column
  function fillCol(colId, orders) {
    const col = document.getElementById(colId);
    col.innerHTML = '';
    if (!orders.length) {
      col.innerHTML = `<div class="empty-col"><div class="e-icon">✓</div><div class="e-text">ว่างอยู่</div></div>`;
      return;
    }
    orders.forEach(o => col.appendChild(orderCard(o)));
  }

  fillCol('col-pending', pending);
  fillCol('col-cooking', cooking);
  fillCol('col-ready',   ready);

  // Done ticker
  const ticker = document.getElementById('done-ticker');
  if (done.length) {
    ticker.style.display = 'flex';
    document.getElementById('done-items').innerHTML = done.map(o => {
      const n = o.id ? '#' + o.id.slice(-4).toUpperCase() : '';
      const name = o.customerName || o.customerPhone || '';
      return `<span class="done-chip">${n}${name ? ' · '+name : ''}</span>`;
    }).join('');
  } else {
    ticker.style.display = 'none';
  }
}

// ── Update times every 30s ──
setInterval(() => {
  if (allOrders.length) renderBoard();
}, 30000);

// ── Listen to orders ──
function startListening() {
  if (unsub) unsub();
  const dot = document.getElementById('realtime-dot');
  unsub = onSnapshot(collection(db, 'orders'),
    snap => {
      const prev = new Set(knownIds);
      allOrders = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(o => !['done','cancelled'].includes(o.status) ||
                     (o.status === 'done' && minsAgo(o) < 60))
        .sort((a,b) => {
          const ta = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt||0);
          const tb = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt||0);
          return ta - tb; // oldest first
        });

      // detect new pending orders
      const newPending = allOrders.filter(o =>
        o.status === 'pending' && !prev.has(o.id)
      );
      if (newPending.length && knownIds.size > 0) playBeep();
      knownIds = new Set(allOrders.map(o => o.id));

      dot.style.background = '#22c55e';
      renderBoard();
    },
    err => {
      console.error(err);
      dot.style.background = '#ef4444';
    }
  );
}

// ── Login ──
window.doLogin = async function() {
  const pw  = document.getElementById('pw-input').value;
  const err = document.getElementById('login-err');
  if (!pw) { err.textContent = 'กรุณาใส่รหัสผ่าน'; return; }
  err.textContent = 'กำลังตรวจสอบ...';
  try {
    // ใช้ Firebase callable เหมือน admin.html
    const { getFunctions, httpsCallable } = await import(
      "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js");
    const fns = getFunctions(app, 'asia-southeast1');
    const verify = httpsCallable(fns, 'verifyAdminPassword');
    const res = await verify({ password: pw });
    if (res.data?.ok) {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('app').style.flexDirection = 'column';
      startListening();
    } else {
      err.textContent = 'รหัสผ่านไม่ถูกต้อง';
    }
  } catch(e) {
    err.textContent = 'เกิดข้อผิดพลาด: ' + (e.code || e.message);
  }
};

// Enter key on password
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});
</script>
